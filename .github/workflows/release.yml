name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" ./*.vsix --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}